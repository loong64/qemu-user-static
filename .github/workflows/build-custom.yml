name: Build Custom

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build Version'
        required: true
        default: 'latest'

jobs:
  build-custom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.version }}
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build-custom
    steps:
      - uses: docker/setup-qemu-action@v3
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.event.inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Test Image
        run: |
          docker run --rm --platform linux/arm64 alpine uname -a
          docker run --rm --platform linux/arm/v7 alpine uname -a
          docker run --rm --platform linux/ppc64le alpine uname -a
          docker run --rm --platform linux/s390x alpine uname -a
          docker run --rm --platform linux/riscv64 alpine uname -a
          docker run --rm --platform linux/loong64 ghcr.io/loong64/alpine uname -a
          docker run --rm --platform linux/loong64 ghcr.io/loong64/debian apt update
          docker run --rm --platform linux/s390x ubuntu apt update
          docker run --rm --platform linux/ppc64le ubuntu apt update
          docker run --rm --platform linux/arm64 ubuntu apt update